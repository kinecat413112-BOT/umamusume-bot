name: Check Uma Musume TW News

on:
  repository_dispatch:
    types: [check_tw_news] # cron-job.org 觸發用事件
  workflow_dispatch:        # 手動測試觸發

permissions:
  contents: write           # 賦予自動 Commit & Push last_news.json 的權限

jobs:
  check-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run tw.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python tw.py

      - name: Commit and Push last_news.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add last_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update last_news.json [skip ci]" && git push)
